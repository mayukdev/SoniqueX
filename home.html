<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoniqueX - Discover Music</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: white; 
            margin: 0; 
            padding: 0; 
            text-align: center; 
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #6A0DAD; 
            padding: 15px;
        }
        .logo-container {
            display: flex;
            align-items: center;
        }
        .logo {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }
        .menu {
            position: relative;
        }
        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            background: #fff;
            color: #6A0DAD;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            background: #222;
            padding: 5px;
            border-radius: 5px;
        }
        .dropdown a {
            display: block;
            padding: 10px;
            color: white;
            text-decoration: none;
        }
        .dropdown a:hover {
            background: #6A0DAD;
        }
        #searchBar {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            background: linear-gradient(135deg, #6A0DAD, #FF5733, #FFCC00);
            color: white;
            cursor: pointer;
            text-align: left;
        }
        #searchBar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        #searchBar:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .btn-fonk {
            background: #ff5733;
        }
        .btn-new {
            background: #ffcc00;
        }
        .slider-container {
            overflow-x: auto;
            white-space: nowrap;
            padding: 20px;
            margin: 0 auto;
            max-width: 90%;
        }
        .slider-container::-webkit-scrollbar {
            height: 8px;
        }
        .slider-container::-webkit-scrollbar-thumb {
            background: #6A0DAD;
            border-radius: 4px;
        }
        .slider-container::-webkit-scrollbar-track {
            background: #222;
        }
        .music-card {
            display: inline-block;
            width: 150px;
            background: #222;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
            margin-right: 15px;
        }
        .music-card:hover {
            transform: scale(1.05);
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        h3 {
            margin: 10px 0 0;
            font-size: 16px;
            white-space: normal;
        }
        .footer {
            background: #6A0DAD;
            padding: 15px;
            margin-top: 20px;
        }
        .aesthetic-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .aesthetic-menu h2 {
            color: #6A0DAD;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .aesthetic-menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .aesthetic-menu ul li {
            margin: 15px 0;
        }
        .aesthetic-menu ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .aesthetic-menu ul li a:hover {
            color: #6A0DAD;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: white;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #6A0DAD;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo">
            <h2>SoniqueX</h2>
        </div>
        <div class="menu">
            <div class="menu-icon" onclick="openAestheticMenu()">☰</div>
            <div class="dropdown" id="dropdownMenu">
                <a href="index.html">Landing</a>
            </div>
        </div>
    </header>

    <input type="text" id="searchBar" placeholder="Search for music..." oninput="searchMusic()">

    <div class="buttons">
        <a href="fonk.html" class="btn btn-fonk">Fonk</a>
        <a href="new release.html" class="btn btn-new">New Songs</a>
    </div>

    <h2>Discover Music</h2>
    <div class="slider-container" id="discoverSlider"></div>

    <h2>Trending Music</h2>
    <div class="slider-container" id="trendingSlider"></div>

    <h2>Recommendations</h2>
    <div class="slider-container" id="recommendationsSlider"></div>

    <h2>New Release Music</h2>
    <div class="slider-container" id="newReleaseSlider"></div>

    <div class="footer">
        <h3>Thanks For Using Us...</h3>
    </div>

    <!-- Aesthetic Menu -->
    <div class="aesthetic-menu" id="aestheticMenu">
        <div class="close-btn" onclick="closeAestheticMenu()">✖</div>
        <h2>WEB</h2>
        <ul>
            <li><a href="index.html">Landing</a></li>
            <li><a href="trending.html">Trending Music</a></li>
            <li><a href="recommendation.html">Recommended Music</a></li>
            <li><a href="new release.html">New Release</a></li>
            <li><a href="fonk.html">Fonk</a></li>
        </ul>
        <h2>OTHER</h2>
        <ul>
            <li><a href="features.html">Our Features</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </div>

    <script>
        function openAestheticMenu() {
            const menu = document.getElementById("aestheticMenu");
            menu.style.display = "block";
        }

        function closeAestheticMenu() {
            const menu = document.getElementById("aestheticMenu");
            menu.style.display = "none";
        }

        // Close the aesthetic menu when clicking outside
        window.onclick = function(event) {
            const menu = document.getElementById("aestheticMenu");
            if (event.target === menu) {
                menu.style.display = "none";
            }
        };

        async function loadMusic() {
            try {
                // Load Discover Music
                const response = await fetch("music.json");
                const songs = await response.json();
                displayDiscoverMusic(songs);

                // Load Trending Music
                const trendResponse = await fetch("trend.json");
                const trendingSongs = await trendResponse.json();
                displayTrendingMusic(trendingSongs);

                // Load Recommendations
                displayRecommendations(songs);

                // Load New Release Music
                displayNewReleaseMusic(songs);
            } catch (error) {
                console.error("Error loading music:", error);
            }
        }

        function displayDiscoverMusic(songs) {
            const slider = document.getElementById("discoverSlider");
            slider.innerHTML = "";
            songs.forEach(song => {
                const card = document.createElement("div");
                card.className = "music-card";
                card.innerHTML = `
                    <img src="${song.image}" alt="${song.title}" onclick="openSong('${song.id}')">
                    <h3 onclick="openSong('${song.id}')">${song.title}</h3>
                    <p>${song.singer}</p>
                `;
                slider.appendChild(card);
            });
        }

        function displayTrendingMusic(trendingSongs) {
            const slider = document.getElementById("trendingSlider");
            slider.innerHTML = "";
            trendingSongs.forEach(song => {
                const card = document.createElement("div");
                card.className = "music-card";
                card.innerHTML = `
                    <img src="${song.image}" alt="${song.title}" onclick="openSong('${song.id}')">
                    <h3 onclick="openSong('${song.id}')">${song.title}</h3>
                    <p>${song.singer}</p>
                `;
                slider.appendChild(card);
            });
        }

        function displayRecommendations(songs) {
            const slider = document.getElementById("recommendationsSlider");
            slider.innerHTML = "";

            // Randomly shuffle the songs array
            const shuffledSongs = songs.sort(() => 0.5 - Math.random());

            // Display only 5 random recommendations
            const recommendations = shuffledSongs.slice(0, 5);
            recommendations.forEach(song => {
                const card = document.createElement("div");
                card.className = "music-card";
                card.innerHTML = `
                    <img src="${song.image}" alt="${song.title}" onclick="openSong('${song.id}')">
                    <h3 onclick="openSong('${song.id}')">${song.title}</h3>
                    <p>${song.singer}</p>
                `;
                slider.appendChild(card);
            });
        }

        function displayNewReleaseMusic(songs) {
            const slider = document.getElementById("newReleaseSlider");
            slider.innerHTML = "";

            // Filter new release songs (e.g., last 5 uploaded songs)
            const newReleases = songs.slice(-5); // Get the last 5 songs
            newReleases.forEach(song => {
                const card = document.createElement("div");
                card.className = "music-card";
                card.innerHTML = `
                    <img src="${song.image}" alt="${song.title}" onclick="openSong('${song.id}')">
                    <h3 onclick="openSong('${song.id}')">${song.title}</h3>
                    <p>${song.singer}</p>
                `;
                slider.appendChild(card);
            });
        }

        function searchMusic() {
            const searchInput = document.getElementById("searchBar").value.toLowerCase();
            document.querySelectorAll(".music-card h3").forEach(title => {
                const card = title.parentElement;
                card.style.display = title.innerText.toLowerCase().includes(searchInput) ? "inline-block" : "none";
            });
        }

        function openSong(id) {
            window.location.href = `gig.html?id=${id}`;
        }

        loadMusic();
        
        
        function searchMusic() {
    const searchInput = document.getElementById("searchBar").value.toLowerCase();
    document.querySelectorAll(".music-card").forEach(card => {
        const title = card.querySelector("h3").innerText.toLowerCase();
        card.style.display = title.includes(searchInput) ? "inline-block" : "none";
    });
}
    </script>

</body>
</html>
