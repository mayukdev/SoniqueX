<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #121212;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .loader-container {
            position: relative;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        .logo {
            width: 120px;
            height: 120px;
            animation: pulse 2s infinite ease-in-out;
        }
        .loading-text {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            letter-spacing: 1px;
            opacity: 0.9;
            animation: fadeInText 2s infinite alternate ease-in-out;
        }
        .progress-bar {
            width: 150px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6A0DAD, #FF5733);
            border-radius: 10px;
            animation: loading 5s linear forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeInText {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
    <script>
        setTimeout(function() {
            window.location.href = "home.html";
        }, 5000);
    </script>
</head>
<body>

    <div class="loader-container">
        <img src="logo.png" alt="Logo" class="logo">
        <p class="loading-text">Getting things ready...</p>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>

</body>
</html>
